syntax = "proto3";
package kv;

service KvService {
  rpc Get (GetRequest) returns (GetResponse);
  rpc Scan (ScanRequest) returns (ScanResponse);
  rpc ExecuteTxn (TxnRequest) returns (TxnResponse);
}

message GetRequest {
  bytes key = 1;
  uint64 version = 2;
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
  string error = 3;
}

message ScanRequest {
  bytes start_key = 1;
  bytes end_key = 2;
  uint32 limit = 3;
  uint64 version = 4;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

message ScanResponse {
  repeated KeyValue kvs = 1;
  string error = 2;
}

message Mutation {
  enum Op {
    PUT = 0;
    DELETE = 1;
  }
  Op op = 1;
  bytes key = 2;
  bytes value = 3;
}

message TxnRequest {
  uint64 start_ts = 1;
  uint64 commit_ts = 2;
  repeated Mutation mutations = 3;
  bytes primary_lock = 4;
}

message TxnResponse {
  bool success = 1;
  string error = 2;
}