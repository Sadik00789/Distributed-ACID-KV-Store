syntax = "proto3";
package kv;

import "txn.proto";

service KvService {
  rpc Get (GetRequest) returns (GetResponse);
  rpc Scan (ScanRequest) returns (ScanResponse);
  rpc ExecuteTxn (TxnRequest) returns (TxnResponse);
  rpc BatchPrewrite (BatchPrewriteRequest) returns (BatchPrewriteResponse);
  rpc BatchCommit (BatchCommitRequest) returns (BatchCommitResponse);
  rpc AskSplit (AskSplitRequest) returns (AskSplitResponse);
  rpc ReportRegionStats (RegionStatsRequest) returns (RegionStatsResponse);
}

message GetRequest {
  bytes key = 1;
  uint64 version = 2;
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
  string error = 3;
}

message ScanRequest {
  bytes start_key = 1;
  bytes end_key = 2;
  uint32 limit = 3;
  uint64 version = 4;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

message ScanResponse {
  repeated KeyValue kvs = 1;
  string error = 2;
}

message Mutation {
  enum Op {
    PUT = 0;
    DELETE = 1;
  }
  Op op = 1;
  bytes key = 2;
  bytes value = 3;
}

message TxnRequest {
  uint64 start_ts = 1;
  uint64 commit_ts = 2;
  repeated Mutation mutations = 3;
  bytes primary_lock = 4;
}

message TxnResponse {
  bool success = 1;
  string error = 2;
}

message BatchPrewriteRequest {
  uint64 start_ts = 1;
  bytes primary_lock = 2;
  uint64 lock_ttl = 3;
  repeated Mutation mutations = 4;
}

message BatchPrewriteResponse {
  repeated txn.KeyError errors = 1;
}

message BatchCommitRequest {
  uint64 start_ts = 1;
  uint64 commit_ts = 2;
  repeated bytes keys = 3;
}

message BatchCommitResponse {
  txn.KeyError error = 1;
}

message AskSplitRequest {
  uint64 region_id = 1;
  bytes split_key = 2;
}

message AskSplitResponse {
  uint64 new_region_id = 1;
  bytes left_start_key = 2;
  bytes left_end_key = 3;
  bytes right_start_key = 4;
  bytes right_end_key = 5;
  string error = 6;
}

message RegionStatsRequest {
  uint64 region_id = 1;
  uint64 key_count = 2;
  uint64 bytes_written = 3;
}

message RegionStatsResponse {
  bool split_recommended = 1;
  bytes suggested_split_key = 2;
}